name: Build and Push Docker to Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Yandex Container Registry
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          if [ -z "$YC_SA_KEY" ]; then
            echo "ERROR: YC_SA_KEY is empty"
            exit 1
          fi

          printf '%s' "$YC_SA_KEY" | docker login \
            --username json_key \
            --password-stdin cr.yandex

      - name: Build Docker image
        run: |
          docker build \
            -f deploy/Dockerfile \
            -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/generator-kartinok:latest .

      - name: Test Docker startup
        run: |
          IMAGE="cr.yandex/${{ secrets.YC_REGISTRY_ID }}/generator-kartinok:latest"

          echo "Checking Python imports..."
          docker run --rm "$IMAGE" \
            python -c "from main import app; print('IMPORT OK')"

          echo "Starting API..."
          docker run -d \
            --name generator-test \
            -p 8080:8080 \
            "$IMAGE"

          for i in {1..20}; do
               if curl --fail --silent http://localhost:8080/api/health > /dev/null; then
              echo "API is ready"
              break
            fi
            sleep 1
          done

          echo "Checking API health..."
          if curl --fail --silent --show-error \
            http://localhost:8080/api/health; then
            echo "API STARTED SUCCESSFULLY"
          else
            echo "API STARTUP FAILED"
            docker logs generator-test
            exit 1
          fi

          docker stop generator-test

      - name: Push Docker image
        run: |
          docker push \
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/generator-kartinok:latest
